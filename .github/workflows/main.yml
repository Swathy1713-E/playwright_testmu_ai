name: Run Hyperexecute Playwright

on:
  schedule:
    - cron: '30 5,17 * * *'
  workflow_dispatch:

jobs:
  runHyperexecute:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo code
        uses: actions/checkout@v4

      - name: Run hyperexecute workflow
        run: |
          echo "Running hyperexecute.yaml..."
          if [ -f myproject/hyperexecute.yaml ]; then
            bash myproject/hyperexecute.yaml
          else
            echo "hyperexecute.yaml not found in myproject/"
            exit 1
          fi
